<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Fiber Comparison</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#eef2f7;
}

.container{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}

.header{
  font-size:22px;
  font-weight:600;
  margin-bottom:10px;
}

.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  flex:1;
}

/* LEFT */
.card{
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.06);
}

svg{
  display:block;
  margin:auto;
}

/* RIGHT */
.param{
  margin-bottom:15px;
}

label{
  font-size:14px;
  font-weight:600;
}

input[type=range]{
  width:100%;
}

.value{
  font-size:13px;
  background:#eaeef5;
  padding:3px 8px;
  border-radius:20px;
}

/* RESULTS */
.results{
  margin-top:10px;
}

.result{
  font-size:18px;
  font-weight:700;
}

.verdict{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">🧬 Hollow Fiber Fair Comparison</div>

<div class="main">

<!-- LEFT: GEOMETRY -->
<div class="card">
<h3>Geometry</h3>

<p style="text-align:center;">Inside-Out (fixed)</p>
<svg id="svg-io" width="200" height="200"></svg>

<p style="text-align:center;">Outside-In (design variable)</p>
<svg id="svg-oi" width="200" height="200"></svg>

<p style="text-align:center;">
Area IO: <span id="io-area"></span><br>
Area OI: <span id="oi-area"></span>
</p>

</div>

<!-- RIGHT: PARAMETERS -->
<div class="card">

<h3>Design Parameters (Outside-In)</h3>

<div class="param">
<label>Inner radius Rin</label><br>
<input type="range" id="rin" min="0.3" max="0.9" step="0.01" value="0.5">
<span id="rin-v" class="value"></span>
</div>

<div class="param">
<label>Outer radius Rout</label><br>
<input type="range" id="rout" min="0.6" max="2.0" step="0.01" value="1.2">
<span id="rout-v" class="value"></span>
</div>

<div class="param">
<label>Blood flow Qb</label><br>
<input type="range" id="qb" min="1" max="20" step="0.5" value="6">
<span id="qb-v" class="value"></span>
</div>

<div class="param">
<label>OAT1 activity</label><br>
<input type="range" id="oat" min="0.2" max="2.0" step="0.05" value="1">
<span id="oat-v" class="value"></span>
</div>

<div class="results">
<p>Inside-Out CL: <span id="cl-io" class="result"></span></p>
<p>Outside-In CL: <span id="cl-oi" class="result"></span></p>
<p>Volume ratio: <span id="vr"></span></p>

<div id="verdict" class="verdict"></div>
</div>

</div>

</div>
</div>

<script>
(function(){

const R_io = 0.12; // FIXED reference
const L = 50;
const Km = 0.05;
const Vmax_base = 0.002;

function drawIO(){
  const svg = document.getElementById("svg-io");
  svg.innerHTML="";
  const cx=100, cy=100;
  const scale=300;

  function circle(r,color){
    let c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",cx);
    c.setAttribute("cy",cy);
    c.setAttribute("r",r*scale);
    c.setAttribute("fill",color);
    svg.appendChild(c);
  }

  circle(R_io+0.2,"#FAEEDA"); // dialysate
  circle(R_io+0.1,"#FBEAF0"); // cell
  circle(R_io+0.05,"#B5D4F4"); // membrane
  circle(R_io,"#F5C4B3"); // blood
}

function drawOI(Rin,Rout){
  const svg = document.getElementById("svg-oi");
  svg.innerHTML="";
  const cx=100, cy=100;
  const scale=150;

  function circle(r,color){
    let c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",cx);
    c.setAttribute("cy",cy);
    c.setAttribute("r",r*scale);
    c.setAttribute("fill",color);
    svg.appendChild(c);
  }

  circle(Rout,"#F5C4B3"); // blood
  circle(Rin,"white"); // hole

  circle(Rin-0.05,"#B5D4F4"); // membrane
  circle(Rin-0.1,"#FBEAF0"); // cell
  circle(Rin-0.2,"#FAEEDA"); // dialysate
}

function update(){

let Rin=parseFloat(rin.value);
let Rout=parseFloat(rout.value);
let Qb=parseFloat(qb.value);
let oat=parseFloat(oat.value);

if(Rout<=Rin+0.05) Rout=Rin+0.05;

rin_v.innerText=Rin.toFixed(2);
rout_v.innerText=Rout.toFixed(2);
qb_v.innerText=Qb.toFixed(1);
oat_v.innerText=oat.toFixed(2);

// Areas
let A_io=Math.PI*R_io*R_io;
let A_oi=Math.PI*(Rout*Rout-Rin*Rin);

// Volumes
let V_io=A_io*L;
let V_oi=A_oi*L;

io_area.innerText=A_io.toFixed(4);
oi_area.innerText=A_oi.toFixed(4);

// Clearance model
let Vmax_io=Vmax_base*oat*10;
let Vmax_oi=Vmax_base*oat*10*(A_oi/A_io);

let CL_io=(Vmax_io)/(Km+0.1);
let CL_oi=(Vmax_oi)/(Km+0.1);

// residence effect
let tau_io=(V_io/1000)/Qb;
let tau_oi=(V_oi/1000)/Qb;

CL_io*=1+0.2*Math.log(1+tau_io);
CL_oi*=1+0.2*Math.log(1+tau_oi);

cl_io.innerText=CL_io.toFixed(4);
cl_oi.innerText=CL_oi.toFixed(4);

vr.innerText=(V_oi/V_io).toFixed(2)+"x";

// verdict
if(V_oi/V_io>5){
  verdict.innerHTML="⚠️ Not fair (volume mismatch)";
  verdict.style.background="#ffecec";
}else{
  verdict.innerHTML="✅ Fair comparison";
  verdict.style.background="#e8f8ec";
}

drawIO();
drawOI(Rin,Rout);
}

document.querySelectorAll("input").forEach(el=>el.addEventListener("input",update));

update();

})();
</script>

</body>
</html>
