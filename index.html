<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Fiber Clearance Explorer</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#f0f2f5;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header {
  background:#1a3a5c;
  color:white;
  padding:20px;
  border-radius:15px 15px 0 0;
}

.card {
  background:white;
  padding:25px;
  border-radius:0 0 15px 15px;
}

.two-columns {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

svg {
  background:#fafbfc;
  border-radius:12px;
}

.result-number {
  font-size:1.6rem;
  font-weight:bold;
}

.progress-bar {
  height:6px;
  background:#ddd;
  border-radius:6px;
}

.progress-fill {
  height:100%;
  background:#2c7ab1;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h2>🧬 Hollow Fiber Clearance Explorer</h2>
</div>

<div class="card">

<div class="two-columns">

<!-- LEFT -->
<div>

<h4>Geometry</h4>

<svg id="svgIO" width="140" height="140"></svg>
<p><b>Inside-Out (fixed)</b></p>

<svg id="svgOI" width="140" height="140"></svg>
<p><b>Outside-In (design)</b></p>

</div>

<!-- RIGHT -->
<div>

<h4>Controls</h4>

Membrane area
<input type="range" id="areaSlider" min="2" max="25" step="0.5" value="10">

Blood flow
<input type="range" id="qbSlider" min="1" max="25" value="6">

Concentration
<input type="range" id="cinSlider" min="0.01" max="0.5" step="0.01" value="0.1">

OAT1 activity
<input type="range" id="oatSlider" min="0.2" max="2.5" step="0.1" value="1">

</div>

</div>

<hr>

<h4>Results</h4>

Inside-Out: <span id="ioCL"></span><br>
Outside-In: <span id="oiCL"></span>

<div class="progress-bar">
  <div id="ioBar" class="progress-fill"></div>
</div>

<div class="progress-bar">
  <div id="oiBar" class="progress-fill" style="background:#c97e2a"></div>
</div>

<p id="verdict"></p>

</div>
</div>

<script>
(function(){

const R_lumen = 0.12;
const L = 50;

const Km = 0.05;
const BASE_Vmax = 0.0025;

const areaSlider = document.getElementById('areaSlider');
const qbSlider = document.getElementById('qbSlider');
const cinSlider = document.getElementById('cinSlider');
const oatSlider = document.getElementById('oatSlider');

const svgIO = document.getElementById('svgIO');
const svgOI = document.getElementById('svgOI');

function drawInsideOut(){
  svgIO.innerHTML="";
  const cx=70, cy=70;
  const scale=300;

  function c(r,color){
    let el=document.createElementNS("http://www.w3.org/2000/svg","circle");
    el.setAttribute("cx",cx);
    el.setAttribute("cy",cy);
    el.setAttribute("r",r*scale);
    el.setAttribute("fill",color);
    svgIO.appendChild(el);
  }

  c(R_lumen+0.25,"#FAEEDA");
  c(R_lumen+0.18,"#FBEAF0");
  c(R_lumen+0.12,"#B5D4F4");
  c(R_lumen,"#F5C4B3");
}

function drawOutsideIn(A){
  svgOI.innerHTML="";
  const cx=70, cy=70;

  const Rin=0.4;
  const Rout=Math.sqrt(A/Math.PI + Rin*Rin);

  const scale=80;

  function c(r,color){
    let el=document.createElementNS("http://www.w3.org/2000/svg","circle");
    el.setAttribute("cx",cx);
    el.setAttribute("cy",cy);
    el.setAttribute("r",r*scale);
    el.setAttribute("fill",color);
    svgOI.appendChild(el);
  }

  c(Rout,"#F5C4B3");
  c(Rin,"white");
  c(Rin-0.08,"#B5D4F4");
  c(Rin-0.15,"#FBEAF0");
  c(Rin-0.25,"#FAEEDA");
}

function update(){

  const A=parseFloat(areaSlider.value);
  const Q=parseFloat(qbSlider.value);
  const Cin=parseFloat(cinSlider.value);
  const oat=parseFloat(oatSlider.value);

  const A_lumen=Math.PI*R_lumen*R_lumen;
  const V_io=A_lumen*L;
  const V_oi=A*L;

  const tau_io=(V_io/1000)/Q;
  const tau_oi=(V_oi/1000)/Q;

  const Vmax_io=BASE_Vmax*oat*A;
  const Vmax_oi=BASE_Vmax*oat*A*1.2;

  const J_io=(Vmax_io*Cin)/(Km+Cin);
  const J_oi=(Vmax_oi*Cin)/(Km+Cin);

  const CL_io=(J_io/Cin)*(1+0.25*Math.log(1+tau_io));
  const CL_oi=(J_oi/Cin)*(1+0.2*Math.log(1+tau_oi));

  const io=CL_io/60;
  const oi=CL_oi/60;

  document.getElementById("ioCL").innerText=io.toFixed(5);
  document.getElementById("oiCL").innerText=oi.toFixed(5);

  const max=Math.max(io,oi,1e-6);
  document.getElementById("ioBar").style.width=(io/max*100)+"%";
  document.getElementById("oiBar").style.width=(oi/max*100)+"%";

  const ratio=oi/io;
  document.getElementById("verdict").innerText=
    ratio>1.2?"Outside-in better":
    ratio<0.8?"Inside-out better":
    "Comparable";

  drawInsideOut();
  drawOutsideIn(A);
}

areaSlider.oninput=update;
qbSlider.oninput=update;
cinSlider.oninput=update;
oatSlider.oninput=update;

update();

})();
</script>

</body>
</html>
